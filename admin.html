```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-container">

  <header class="admin-header">
    <div>
      <div class="logo">Vissa<span>Pro</span></div>
      <p>Payment Administration</p>
    </div>

    <button onclick="loadPayments()" class="refresh">↻ Refresh</button>
  </header>

  <div class="stats">
    <div class="stat">
      <span>⏳</span>
      <b id="pendingCount">0</b>
      <small>Pending</small>
    </div>

    <div class="stat">
      <span>✅</span>
      <b id="approvedCount">0</b>
      <small>Approved</small>
    </div>

    <div class="stat">
      <span>❌</span>
      <b id="rejectedCount">0</b>
      <small>Rejected</small>
    </div>
  </div>

  <div id="payments"></div>

</div>

<script>
const API = "YOUR_WORKER_URL";
const ADMIN_KEY = "YOUR_ADMIN_KEY";

async function loadPayments() {

  const box = document.getElementById("payments");
  box.innerHTML = "<div class='loading'>Loading requests...</div>";

  try {

    const response = await fetch(API + "/api/admin/payments", {
      headers: {
        "Authorization": "Bearer " + ADMIN_KEY
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unauthorized");
    }

    document.getElementById("pendingCount").textContent =
      data.stats.pending;

    document.getElementById("approvedCount").textContent =
      data.stats.approved;

    document.getElementById("rejectedCount").textContent =
      data.stats.rejected;

    box.innerHTML = "";

    data.payments.forEach(payment => {

      const item = document.createElement("div");
      item.className = "payment";

      item.innerHTML = `
        <div class="payment-info">
          <h3>${escapeHTML(payment.email)}</h3>
          <p>💵 Amount: $5</p>
          <p>🕒 ${new Date(payment.created_at).toLocaleString()}</p>
          <span class="badge ${payment.status}">
            ${payment.status.toUpperCase()}
          </span>
        </div>

        <div class="payment-actions">
          <a
            class="receipt-btn"
            href="${payment.receipt_url}"
            target="_blank">
            👁 VIEW RECEIPT
          </a>

          ${
            payment.status === "pending"
            ? `
              <button class="approve"
                onclick="approvePayment('${payment.id}')">
                ✓ APPROVE
              </button>

              <button class="reject"
                onclick="rejectPayment('${payment.id}')">
                ✕ REJECT
              </button>
            `
            : ""
          }
        </div>
      `;

      box.appendChild(item);
    });

  } catch (err) {
    box.innerHTML =
      `<div class="error">${escapeHTML(err.message)}</div>`;
  }
}

async function approvePayment(id) {

  if (!confirm("Approve this payment?")) return;

  const response = await fetch(API + "/api/admin/approve", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + ADMIN_KEY
    },
    body: JSON.stringify({ id })
  });

  const data = await response.json();

  if (!response.ok) {
    alert(data.error || "Failed");
    return;
  }

  alert("Payment approved!");
  loadPayments();
}

async function rejectPayment(id) {

  const reason = prompt("Reason for rejection:");

  if (reason === null) return;

  const response = await fetch(API + "/api/admin/reject", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + ADMIN_KEY
    },
    body: JSON.stringify({
      id,
      reason
    })
  });

  const data = await response.json();

  if (!response.ok) {
    alert(data.error || "Failed");
    return;
  }

  alert("Payment rejected.");
  loadPayments();
}

function escapeHTML(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadPayments();
</script>

</body>
</html>
```
